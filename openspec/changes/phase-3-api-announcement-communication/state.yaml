product_decisions:
  status: confirmed
  authority: product_input_only
  confirmed:
    - One resident feed carries published upserts and withdrawal/archive tombstones.
    - Invalid cursors return 400 CURSOR_INVALID.
    - Phase 3 cursors do not expire.
    - POST /api/announcements/:id/archive is idempotent, terminal, and returns HTTP 200 with the resource.
    - Author responses use a profile plus persisted snapshot; Web displays name only.
    - Create-with-immediate-publication records distinct create and publish audit events.
    - Concurrent transitions use row locking.
    - publishedAt records first publication; edits preserve published state; immediate publication remains supported.
    - Archived announcements are excluded by default and are read-only when explicitly listed.
    - Push notifications and mobile UI are out of scope.
